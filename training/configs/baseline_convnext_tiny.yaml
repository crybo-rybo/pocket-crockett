model:
  type: timm
  name: convnext_tiny.fb_in22k_ft_in1k
  pretrained: true
  drop_rate: 0.1

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  weighted_sampler: true
  normalization: imagenet

training:
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.05
  freeze_backbone_epochs: 2
  weighted_loss: true
