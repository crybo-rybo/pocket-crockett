model:
  type: bioclip
  bioclip_name: hf-hub:imageomics/bioclip
  pretrained: true
  drop_rate: 0.1

data:
  image_size: 224
  batch_size: 32
  num_workers: 4
  weighted_sampler: true

training:
  pretrain:
    epochs: 5
    learning_rate: 0.0001
    weight_decay: 0.01
    freeze_backbone_epochs: 0
    weighted_loss: true
  finetune:
    epochs: 15
    learning_rate: 0.00005
    weight_decay: 0.01
    freeze_backbone_epochs: 2
    weighted_loss: true

# Stage A (pretrain): ./runpod/train.sh bioclip-pretrain
# Requires INCLUDE_PRETRAINING=1 bootstrap and open-clip-torch installed.
# Stage B (finetune): CHECKPOINT=/workspace/runs/<pretrain-run>/checkpoint-best.pt ./runpod/train.sh bioclip-finetune
